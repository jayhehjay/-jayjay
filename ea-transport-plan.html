<title>EA Transport Personel Planı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="app-css">
  :root {
    --bg: #eef1f5; --surface: #ffffff; --surface-2: #f5f7fa; --ink: #14213a; --muted: #5f6b7e;
    --line: #dde3eb; --line-strong: #c3ccd8; --head: #13274a; --head-2: #1d3864; --head-ink: #ffffff;
    --brass: #b08a45; --brass-soft: #ecdcb8; --focus: #6f95d4; --today: #fbf3df;
    --accent: #13274a; --accent-ink: #ffffff; --wa: #1f7a4d; --wa-ink: #ffffff;
    --work-bg: #e2f0e6; --work-fg: #276444; --work-bd: #bddcc7;
    --off-bg:  #eceff3; --off-fg:  #5b6576; --off-bd:  #d3d9e1;
    --sick-bg: #f6e0df; --sick-fg: #9b3534; --sick-bd: #e7c0bf;
    --hol-bg:  #f7edcf; --hol-fg:  #83620f; --hol-bd:  #e5d39c;
    --shadow: 0 1px 2px rgba(19, 39, 74, .06), 0 4px 14px rgba(19, 39, 74, .05);
    --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0c1422; --surface: #132036; --surface-2: #192941; --ink: #e6ebf3; --muted: #98a4b9;
      --line: #25365a; --line-strong: #34497a; --head: #0a1427; --head-2: #13254a; --head-ink: #f2f5fa;
      --brass: #cfa75d; --brass-soft: #e9d3a5; --focus: #8fb0ea; --today: #2a2615;
      --accent: #cfa75d; --accent-ink: #14213a; --wa: #2f9a64; --wa-ink: #07140d;
      --work-bg: #183526; --work-fg: #93d4ab; --work-bd: #2a5a40;
      --off-bg: #212c40;  --off-fg: #a6b1c3;  --off-bd: #34425c;
      --sick-bg: #3b1f23; --sick-fg: #f0a8a6; --sick-bd: #6a3338;
      --hol-bg: #372f17;  --hol-fg: #e7cb7a;  --hol-bd: #66552a;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c1422; --surface: #132036; --surface-2: #192941; --ink: #e6ebf3; --muted: #98a4b9;
    --line: #25365a; --line-strong: #34497a; --head: #0a1427; --head-2: #13254a; --head-ink: #f2f5fa;
    --brass: #cfa75d; --brass-soft: #e9d3a5; --focus: #8fb0ea; --today: #2a2615;
    --accent: #cfa75d; --accent-ink: #14213a; --wa: #2f9a64; --wa-ink: #07140d;
    --work-bg: #183526; --work-fg: #93d4ab; --work-bd: #2a5a40;
    --off-bg: #212c40;  --off-fg: #a6b1c3;  --off-bd: #34425c;
    --sick-bg: #3b1f23; --sick-fg: #f0a8a6; --sick-bd: #6a3338;
    --hol-bg: #372f17;  --hol-fg: #e7cb7a;  --hol-bd: #66552a;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
  .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

  /* Başlık */
  .top { background: linear-gradient(135deg, var(--head), var(--head-2)); color: var(--head-ink); border-bottom: 3px solid var(--brass); padding: 16px; }
  .top-in { max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
  .brand { display: flex; gap: 14px; align-items: center; }
  .mark { width: 50px; height: 50px; flex: none; border: 2px solid var(--brass); border-radius: 8px; display: grid; place-items: center; font: 700 23px var(--f-display); color: var(--brass); letter-spacing: .04em; }
  .brand h1 { margin: 0; font: 700 28px/1 var(--f-display); letter-spacing: .08em; }
  .brand p { margin: 5px 0 0; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; opacity: .75; }
  .top-right { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
  .month { font: 700 26px var(--f-display); letter-spacing: .1em; color: var(--brass-soft); }
  .langs { display: inline-flex; border: 1px solid rgba(255,255,255,.3); border-radius: 8px; overflow: hidden; }
  .langs button { background: none; border: 0; color: inherit; font: 600 13px var(--f-body); letter-spacing: .08em; padding: 8px 11px; min-height: 36px; cursor: pointer; opacity: .7; }
  .langs button[aria-pressed="true"] { background: var(--brass); color: #14213a; opacity: 1; }
  .chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: #62c48a; }
  .chip.dirty i { background: var(--brass); }
  .chip.busy i { background: #9fb6de; animation: blink 1s infinite; }
  .chip button { background: var(--brass); color: #14213a; border: 0; border-radius: 999px; font: 700 12px var(--f-body); padding: 3px 10px; cursor: pointer; }
  @keyframes blink { 50% { opacity: .3; } }

  main { max-width: 1320px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  body.saving main, body.saving .brush { pointer-events: none; opacity: .65; }

  /* Araç çubuğu */
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .bar .grow { flex: 1; }
  .nav, .chef { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 600 15px var(--f-body); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:hover { background: var(--surface-2); }
  .btn:focus-visible, .cell:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .name:focus-visible, .langs button:focus-visible, .day:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.pri:hover { filter: brightness(1.08); }
  .btn.wa { background: var(--wa); color: var(--wa-ink); border-color: var(--wa); }
  .btn.wa:hover { filter: brightness(1.08); }
  .btn.warn { color: var(--sick-fg); border-color: var(--sick-bd); }
  .btn.warn:hover { background: var(--sick-bg); }
  .btn.sm { min-height: 38px; padding: 0 11px; font-size: 14px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); color: #14213a; }
  select, input[type=text], input[type=url], input[type=time], textarea { min-height: 44px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--ink); font: 500 16px var(--f-body); width: 100%; }
  textarea { min-height: 64px; resize: vertical; }
  .who { display: flex; align-items: center; gap: 8px; }
  .who label { font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .who select { width: auto; min-width: 190px; }

  /* Paneller */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 18px; min-width: 0; }
  .panel-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; margin-bottom: 12px; }
  .panel h2 { margin: 0; font: 700 22px var(--f-display); letter-spacing: .04em; text-wrap: balance; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid; }
  .st-work { background: var(--work-bg); color: var(--work-fg); border-color: var(--work-bd); }
  .st-off  { background: var(--off-bg);  color: var(--off-fg);  border-color: var(--off-bd); }
  .st-sick { background: var(--sick-bg); color: var(--sick-fg); border-color: var(--sick-bd); }
  .st-hol  { background: var(--hol-bg);  color: var(--hol-fg);  border-color: var(--hol-bd); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; border: 1px solid; }

  /* Bugün */
  .today-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .tcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); display: grid; gap: 3px; }
  .tcard .n { font-weight: 700; }
  .tcard .r { display: flex; align-items: center; gap: 7px; font-size: 14px; }
  .tcard .t { font-family: var(--f-mono); font-size: 14px; color: var(--muted); }

  /* Tablolar */
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; }
  tr > :last-child { border-right: 0; }
  tbody tr:last-child > * { border-bottom: 0; }
  thead th { background: var(--surface-2); padding: 8px 6px; font-weight: 600; white-space: nowrap; }
  .sticky { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; min-width: 140px; box-shadow: 1px 0 0 var(--line); }
  thead .sticky { background: var(--surface-2); z-index: 3; padding-left: 14px; }
  .dow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .dn { font: 700 20px/1.1 var(--f-display); }
  th.wk, td.wk { border-left: 3px solid var(--line-strong); }
  th.is-today { background: var(--today); }
  th.is-today .dow { color: var(--brass); }
  td.is-today { background: color-mix(in srgb, var(--today) 55%, transparent); }
  .name { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; min-height: 64px; padding: 8px 12px; border: 0; background: none; color: var(--ink); font: 600 15px var(--f-body); text-align: left; }
  .name.ph { color: var(--muted); font-style: italic; }
  button.name { cursor: pointer; }
  button.name:hover { background: var(--surface-2); }
  .grid td { padding: 3px; min-width: 88px; }
  .cell { width: 100%; min-height: 58px; border-radius: 8px; border: 1px solid transparent; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px 3px; color: var(--ink); font: inherit; position: relative; }
  button.cell { cursor: pointer; }
  button.cell.empty:hover { border: 1px dashed var(--line-strong); background: var(--surface-2); }
  button.cell.empty::after { content: "+"; color: var(--line-strong); font-size: 18px; }
  .cell .tr { display: inline-flex; align-items: center; gap: 4px; font: 600 12px var(--f-mono); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell .tm { font: 600 14px var(--f-mono); white-space: nowrap; }
  .cell .lb { font-weight: 700; font-size: 12px; letter-spacing: .06em; }
  .cell .nd { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .6; }
  .tot { font: 600 14px var(--f-mono); padding: 0 10px; white-space: nowrap; background: var(--surface-2); }
  .zero { color: var(--line-strong); }
  .sum td { padding: 10px; font: 500 14px var(--f-mono); white-space: nowrap; }
  .sum td.sticky { font: 600 15px var(--f-body); padding-left: 14px; }
  .sum .rg { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
  .sum .cur { background: var(--today); }
  .sum tfoot td { font-weight: 700; background: var(--surface-2); border-top: 2px solid var(--line); }
  .sum tfoot td.sticky { background: var(--surface-2); }
  .totals { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .tt { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); display: grid; gap: 6px; align-content: start; }
  .tt .n { font-weight: 700; }
  .tt .h { font: 700 26px var(--f-display); }
  .tt .h small { font: 500 13px var(--f-body); color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .empty { padding: 26px; text-align: center; color: var(--muted); }

  /* Kişisel görünüm */
  .me-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .me-head h2 { font-size: 30px; }
  .kpis { display: flex; flex-wrap: wrap; gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; background: var(--surface-2); min-width: 120px; }
  .kpi b { display: block; font: 700 24px var(--f-display); }
  .kpi span { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .wk-block { margin-top: 14px; }
  .wk-title { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 0 2px 6px; border-bottom: 2px solid var(--line); }
  .wk-title b { font-family: var(--f-mono); color: var(--ink); letter-spacing: 0; }
  .day { display: grid; grid-template-columns: 74px 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .day[data-act] { cursor: pointer; }
  .day.is-today { background: var(--today); border-radius: 8px; padding-inline: 8px; }
  .day .d { font-weight: 700; line-height: 1.15; }
  .day .d small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
  .day .what { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .day .tour { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .day .time { font: 600 15px var(--f-mono); }
  .day .hrs { font: 600 14px var(--f-mono); color: var(--muted); text-align: right; }
  .day .note { grid-column: 2 / -1; font-size: 13px; color: var(--muted); }
  .day .none { color: var(--muted); font-size: 14px; }

  /* Pencere */
  .ov { position: fixed; inset: 0; background: rgba(8, 16, 32, .5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .dlg { background: var(--surface); color: var(--ink); width: 100%; max-width: 460px; max-height: calc(100% - 8px); overflow-y: auto; border-radius: 14px; padding: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.3); }
  .dlg.wide { max-width: 640px; }
  .dlg h3 { margin: 0; font: 700 24px var(--f-display); letter-spacing: .03em; }
  .dlg .sub { margin: 2px 0 16px; color: var(--muted); font-size: 14px; }
  .f { display: grid; gap: 6px; margin-bottom: 14px; }
  .f > label, .f > .l { font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: flex; justify-content: center; align-items: center; min-height: 44px; border-radius: 9px; border: 2px solid transparent; font-weight: 600; cursor: pointer; }
  .seg input:checked + span { border-color: currentColor; }
  .seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
  .dur { font: 500 14px var(--f-mono); color: var(--muted); margin: -6px 0 12px; min-height: 1.2em; }
  .chk { display: flex; gap: 10px; align-items: center; font-weight: 500; margin-bottom: 14px; cursor: pointer; }
  .chk input { width: 20px; height: 20px; }
  .err { color: var(--sick-fg); font-size: 14px; margin-bottom: 10px; }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
  .acts .l { margin-right: auto; }
  .rows { display: grid; gap: 8px; margin-bottom: 12px; }
  .row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; }
  .trow { display: grid; grid-template-columns: 70px 1fr 96px 96px auto; gap: 6px; align-items: center; }
  .trow .c { display: flex; gap: 4px; grid-column: 1 / -1; align-items: center; flex-wrap: wrap; }
  .trow + .trow { border-top: 1px solid var(--line); padding-top: 10px; }
  .cpick { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .cpick[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface) inset; }
  .colhead { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
  .copyrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .steps { margin: 0 0 14px; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
  .plist { display: grid; gap: 6px; margin: 12px 0 16px; }
  .prow { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .prow span { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wa-all { width: 100%; min-height: 52px; font-size: 17px; }

  /* Hızlı giriş */
  .brush { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 3px solid var(--brass); box-shadow: 0 -8px 24px rgba(8, 16, 32, .18); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .brush-in { max-width: 1320px; margin: 0 auto; display: grid; gap: 10px; }
  .brush-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .brush-top b { font: 700 18px var(--f-display); letter-spacing: .06em; margin-right: 4px; }
  .bseg { display: flex; flex-wrap: wrap; gap: 6px; }
  .bseg button { min-height: 42px; padding: 0 14px; border-radius: 9px; border: 2px solid transparent; font: 600 15px var(--f-body); cursor: pointer; }
  .bseg button[aria-pressed="true"] { border-color: currentColor; }
  .bseg .erase { background: var(--surface-2); color: var(--ink); border: 2px dashed var(--line-strong); }
  .bseg .erase[aria-pressed="true"] { border-style: solid; border-color: var(--ink); }
  .brow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .bact { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bact .hint { flex: 1; min-width: 180px; }
  .bact .hint.bad { color: var(--sick-fg); font-weight: 600; }
  body.brushing main { padding-bottom: 270px; }
  body.brushing button.cell:hover { outline: 2px solid var(--brass); outline-offset: -2px; }
  body.brushing .grid thead th[data-act] { cursor: pointer; }
  body.brushing .grid thead th[data-act]:hover { background: var(--brass-soft); color: #14213a; }
  @keyframes pop { 0% { transform: scale(.86); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
  .cell.just { animation: pop .35s ease-out; }

  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
  body.brushing .toast { bottom: calc(230px + env(safe-area-inset-bottom, 0px)); }

  @media (max-width: 640px) {
    .brand h1 { font-size: 23px; }
    .mark { width: 42px; height: 42px; font-size: 19px; }
    .month { font-size: 21px; }
    main { padding: 12px 16px; }
    .panel { padding: 14px; }
    .bar .grow { display: none; }
    .nav { display: grid; grid-template-columns: auto 1fr auto; width: 100%; }
    .who { width: 100%; }
    .who select { flex: 1; min-width: 0; }
    .chef { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
    .chef .btn { padding: 0 8px; font-size: 14px; }
    .chef .btn:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .sticky { min-width: 112px; }
    .ov { align-items: flex-end; padding: 0; }
    .dlg { border-radius: 16px 16px 0 0; max-height: 92%; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
    .trow { grid-template-columns: 64px 1fr auto; }
    .day { grid-template-columns: 62px 1fr auto; }
    .brow { grid-template-columns: 1fr 1fr; }
    .brow select { grid-column: 1 / -1; }
    .bseg { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; }
    .bseg button { padding: 0 4px; font-size: 13px; }
    .brush-top b { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .cell.just, .chip.busy i { animation: none; } }

  const n = new Date(y, m + 1, 0).getDate(), out = [];

}

  const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  let mon = new Date(y, m, 1 - ((first.getDay() + 6) % 7));
  const weeks = [];
  while (mon <= last) {
    const days = [0, 1, 2, 3, 4, 5].map(i => new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i));
    if (days.some(d => d.getMonth() === m)) weeks.push(days);

function renderChip() {
  const c = $('#chip'); if (!c) return;
  if (!canEdit) { c.className = 'chip'; c.innerHTML = `<i></i><span>${t('upToDate')}</span>`; return; }
  if (saving) { c.className = 'chip busy'; c.innerHTML = `<i></i><span>${t('saving')}</span>`; return; }
  if (pending) { c.className = 'chip dirty'; c.innerHTML = `<i></i><span>${t('unsaved', { n: pending })}</span><button data-act="save-now">${t('saveNow')}</button>`; return; }
  c.className = 'chip'; c.innerHTML = `<i></i><span>${t('saved')}</span>`;

function renderWho() {
  const sel = $('#who');
  const opts = `<option value="">${esc(t('team'))}</option>` + plan.employees.map(e => `<option value="${esc(e.id)}">${esc(empName(e))}</option>`).join('');

function tourTag(x) {
  return x ? `<span class="tr"><i class="dot" style="background:${esc(x.color || TOUR_COLORS[0])}"></i>${esc(x.code || x.name)}</span>` : '';
}
const statusPill = s => `<span class="pill ${STATUS_CLS[s] || 'st-off'}">${esc(t(s))}</span>`;

function renderToday() {
  const d = new Date();
  const show = d.getFullYear() === view.y && d.getMonth() === view.m && d.getDay() !== 0 && plan.employees.length;
  $('#todayPanel').hidden = !show;
  if (!show) return;
  $('#todayTitle').textContent = `${t('todayT')} · ${L().dayL[d.getDay()]} ${d.getDate()} ${L().months[d.getMonth()]}`;
  const dk = dkey(d);

  list.sort((a, b) => (a.e?.status === 'work' ? 0 : 1) - (b.e?.status === 'work' ? 0 : 1) || (mins(a.e?.start) ?? 9999) - (mins(b.e?.start) ?? 9999));
  $('#todayGrid').innerHTML = list.map(({ emp, e }) => {
    let body;

function renderGrid() {
  const days = monthDays(view.y, view.m);

function cellHtml(emp, d, e) {
  const dk = dkey(d), tag = canEdit ? 'button' : 'div';
  const just = justApplied[ekey(emp.id, dk)] > Date.now() ? ' just' : '';
  const attrs = canEdit ? ` data-act="cell" data-emp="${esc(emp.id)}" data-date="${dk}" aria-label="${esc(empName(emp))}, ${d.getDate()} ${esc(L().months[d.getMonth()])}"` : '';
  if (!e) return `<${tag} class="cell empty${just}"${attrs}></${tag}>`;
  const title = e.note ? ` title="${esc(e.note)}"` : '';
  const nd = e.note ? '<span class="nd"></span>' : '';
  const inner = e.status === 'work'
    ? `${tourTag(tourById(e.tour))}<span class="tm">${esc(shortT(e.start))}–${esc(shortT(e.end))}</span>`
    : `<span class="lb">${esc(t(e.status + 'S'))}</span>`;
  return `<${tag} class="cell ${STATUS_CLS[e.status] || 'st-off'}${just}"${attrs}${title}>${nd}${inner}</${tag}>`;
}

function weekRange(w) {
  const a = w[0], b = w[5], M = L().mon3;
  return `${a.getDate()} ${M[a.getMonth()]} – ${b.getDate()} ${M[b.getMonth()]}`;
}

function renderWeekly() {
  const weeks = monthWeeks(view.y, view.m), cur = weeks.map(w => w.some(isToday));
  let h = `<thead><tr><th class="sticky">${t('employee')}</th>`;
  weeks.forEach((w, i) => { h += `<th class="${cur[i] ? 'cur' : ''}">${t('weekN', { n: i + 1 })}${cur[i] ? ' · ' + t('thisWeek') : ''}<span class="rg">${weekRange(w)}</span></th>`; });
  h += '</tr></thead><tbody>';
  const tot = weeks.map(() => 0);
  plan.employees.forEach(emp => {
    h += `<tr><td class="sticky">${esc(empName(emp))}</td>`;
    weeks.forEach((w, i) => { const x = sumH(emp.id, w); tot[i] += x; h += `<td class="${cur[i] ? 'cur' : ''}">${x ? fmtH(x) + ' ' + t('hShort') : '<span class="zero">0</span>'}</td>`; });
    h += '</tr>';
  });
  h += `</tbody><tfoot><tr><td class="sticky">${t('total')}</td>` + tot.map(x => `<td>${fmtH(x)} ${t('hShort')}</td>`).join('') + '</tr></tfoot>';
  $('#weekly').innerHTML = h;
}

function renderTotals() {
  const days = monthDays(view.y, view.m);
  $('#monthHint').textContent = t('monthlyHint', { m: L().months[view.m], y: view.y, n: days.length });
  $('#totals').innerHTML = plan.employees.map(emp => {
    const cnt = { work: 0, off: 0, sick: 0, hol: 0 }; let tot = 0;
    days.forEach(d => { const e = getEntry(emp.id, dkey(d)); if (e && cnt[e.status] !== undefined) cnt[e.status]++; tot += entryHours(e); });
    const chips = STATUS_KEYS.filter(k => cnt[k]).map(k => `<span class="pill ${STATUS_CLS[k]}">${esc(t(k))} ${cnt[k]}</span>`).join('');
    return `<div class="tt"><span class="n">${esc(empName(emp))}</span><span class="h">${fmtH(tot)} <small>${t('hours')}</small></span><div class="chips">${chips || `<span class="hint">${t('noEntries')}</span>`}</div></div>`;
  }).join('') || `<div class="empty">${t('noEmps')}</div>`;

function renderPerson(emp) {
  const weeks = monthWeeks(view.y, view.m), days = monthDays(view.y, view.m);

      <div class="kpi"><b>${workDays}</b><span>${t('workDays')}</span></div>
      ${curWeek ? `<div class="kpi"><b>${fmtH(sumH(emp.id, curWeek))}</b><span>${t('hours')} · ${t('thisWeek')}</span></div>` : ''}
    </div></div>`;
  weeks.forEach((w, i) => {
    h += `<div class="wk-block"><div class="wk-title"><span>${t('weekN', { n: i + 1 })} · ${weekRange(w)}</span><b>${fmtH(sumH(emp.id, w))} ${t('hShort')}</b></div>`;
    w.filter(d => d.getMonth() === view.m).forEach(d => {
      const dk = dkey(d), e = getEntry(emp.id, dk);
      let what, hrs = '';
      if (!e) what = `<span class="none">${t('notPlanned')}</span>`;
      else if (e.status === 'work') {
        const x = tourById(e.tour);
        what = `${x ? `<span class="tour"><i class="dot" style="background:${esc(x.color)}"></i>${esc(x.code)} · ${esc(x.name)}</span>` : `<span class="tour">${t('noTour')}</span>`}<span class="time">${esc(e.start)}–${esc(e.end)}</span>`;
        hrs = fmtH(entryHours(e)) + ' ' + t('hShort');
      } else what = statusPill(e.status);
      const act = canEdit ? ` data-act="cell" data-emp="${esc(emp.id)}" data-date="${dk}" role="button" tabindex="0"` : '';
      h += `<div class="day ${isToday(d) ? 'is-today' : ''}"${act}>
              <div class="d">${L().day3[d.getDay()]} ${d.getDate()}<small>${L().mon3[d.getMonth()]}</small></div>
              <div class="what">${what}</div><div class="hrs">${hrs}</div>
              ${e && e.note ? `<div class="note">📝 ${esc(e.note)}</div>` : ''}
            </div>`;

    h += '</div>';
  });
  $('#personView').innerHTML = h;
}

function toast(msg) {
  const el = $('#toast'); if (!el) return;
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.hidden = true; }, 2400);
}

function tourOptions(selected) {
  return `<option value="">${esc(t('tourNone'))}</option>` + plan.tours.map(x =>
    `<option value="${esc(x.id)}"${x.id === selected ? ' selected' : ''}>${esc(x.code)} · ${esc(x.name)}${x.start ? ` (${esc(x.start)}–${esc(x.end)})` : ''}</option>`).join('');
}
function setBrush(on) { brushOn = on && canEdit; render(); }
function renderBrush() {
  const bar = $('#brush'); if (!bar) return;
  bar.hidden = !brushOn;
  document.body.classList.toggle('brushing', brushOn);
  $('#brushBtn')?.setAttribute('aria-pressed', String(brushOn));
  if (!brushOn) return;
  const sel = $('#bTour'), opts = tourOptions(brush.tour);
  if (sel._opts !== opts) { sel.innerHTML = opts; sel._opts = opts; }
  sel.value = tourById(brush.tour) ? brush.tour : '';
  document.querySelectorAll('#bStatus button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === brushStatus)));
  $('#bWork').style.display = brushStatus === 'work' ? '' : 'none';
  $('#bUndo').disabled = !undoStack.length;
  const hint = $('#bHint');
  const bad = brushStatus === 'work' && !brushEntry();
  hint.classList.toggle('bad', bad);
  hint.textContent = bad ? t('badTime') : t('quickHint');
}
function brushEntry() {
  if (brushStatus === 'clear') return null;
  if (brushStatus !== 'work') return { status: brushStatus, tour: null, start: null, end: null, note: '' };
  if (!brush.start || !brush.end || brush.start === brush.end) return undefined;
  return { status: 'work', tour: brush.tour || null, start: brush.start, end: brush.end, note: '' };
}
function applyBrush(targets) {
  const entry = brushEntry();
  if (entry === undefined) { toast(t('badTime')); return; }
  const changes = targets.map(({ empId, dk }) => {
    const prev = getEntry(empId, dk);
    const next = entry && prev && prev.note ? { ...entry, note: prev.note } : entry;   // notu koru
    return { empId, dk, prev, next };
  }).filter(c => JSON.stringify(c.prev || null) !== JSON.stringify(c.next || null));
  if (!changes.length) return;
  const until = Date.now() + 900;
  changes.forEach(c => { setEntry(c.empId, c.dk, c.next); justApplied[ekey(c.empId, c.dk)] = until; });
  undoStack.push(changes.map(c => ({ empId: c.empId, dk: c.dk, entry: c.prev || null })));
  if (undoStack.length > 30) undoStack.shift();
  commit();
}
function undo() {
  const last = undoStack.pop(); if (!last) return;
  last.forEach(c => setEntry(c.empId, c.dk, c.entry));
  toast(t('undone')); commit();
}

function closeDlg() { const ov = $('#ov'); ov.hidden = true; ov.innerHTML = ''; }

function openCell(empId, dk) {

      <button class="btn pri" data-act="cell-save">${t('save')}</button>
    </div>`);
  refreshCellForm();
}
function stVal() { return (document.querySelector('input[name=st]:checked') || {}).value || 'work'; }
function refreshCellForm() {
  const work = stVal() === 'work';
  $('#cTourF').style.display = work ? '' : 'none';
  $('#cStart').disabled = !work; $('#cEnd').disabled = !work;
  const a = $('#cStart').value, b = $('#cEnd').value, h = hoursOf(a, b);
  const over = work && mins(b) !== null && mins(b) < mins(a);
  $('#cDur').textContent = work ? (h ? t('dur', { h: fmtH(h) }) + (over ? ' · ' + t('overnight') : '') : '') : t('noHours');
}
function saveCell(clear) {
  if (!editing) return;
  let entry = null;
  if (!clear) {
    const status = stVal();
    entry = { status, tour: null, start: null, end: null, note: $('#cNote').value.trim() };
    if (status === 'work') {
      const a = $('#cStart').value, b = $('#cEnd').value;
      if (!a || !b || a === b) { const x = $('#cErr'); x.textContent = t('badTime'); x.hidden = false; return; }
      entry.start = a; entry.end = b; entry.tour = $('#cTour').value || null;
      lastTimes = { start: a, end: b };
    }
  }
  const dks = (!clear && $('#cWeek').checked) ? weekOf(editing.dk) : [editing.dk];
  const prev = dks.map(dk => ({ empId: editing.empId, dk, entry: getEntry(editing.empId, dk) }));
  undoStack.push(prev);
  dks.forEach(dk => setEntry(editing.empId, dk, entry));
  closeDlg(); commit(true);
}

/* ---------- Çalışanlar ---------- */
let eDraft = [];
function openEmp(addNew, focusId) {
  eDraft = plan.employees.map(e => ({ id: e.id, name: e.name, del: false, arm: false }));
  if (addNew) eDraft.push({ id: null, name: '', del: false, arm: false });
  openDlg(`<h3>${t('emps')}</h3><p class="sub">${t('empsSub')}</p><div class="rows" id="eRows"></div>
    <button class="btn sm" data-act="e-add">${t('addRow')}</button>
    <div class="acts" style="margin-top:14px"><button class="btn" data-act="dlg-close">${t('cancel')}</button><button class="btn pri" data-act="e-save">${t('save')}</button></div>`, true);
  drawEmp();
  setTimeout(() => {
    const idx = focusId ? eDraft.findIndex(e => e.id === focusId) : addNew ? eDraft.length - 1 : -1;
    const el = idx >= 0 && document.getElementById('emp-' + idx);
    if (el) { el.focus(); el.select(); }
  }, 40);
}
function syncEmp() { document.querySelectorAll('#eRows .row').forEach(r => { eDraft[+r.dataset.i].name = r.querySelector('input').value; }); }
function drawEmp() {
  const vis = eDraft.map((e, i) => ({ e, i })).filter(x => !x.e.del);
  $('#eRows').innerHTML = vis.map(({ e, i }, k) => `
    <div class="row" data-i="${i}">
      <input type="text" id="emp-${i}" value="${esc(e.name)}" maxlength="40" placeholder="${esc(e.id ? t('empN', { n: k + 1 }) : t('namePh'))}" aria-label="${esc(t('namePh'))}">
      <button class="btn sm" data-act="e-up" ${k === 0 ? 'disabled' : ''} aria-label="↑">↑</button>
      <button class="btn sm" data-act="e-down" ${k === vis.length - 1 ? 'disabled' : ''} aria-label="↓">↓</button>
      <button class="btn sm warn" data-act="e-del">${e.arm ? t('sure') : t('del')}</button>
    </div>`).join('') || `<div class="empty">${t('noEmps')}</div>`;
}
function empAction(act, i) {
  syncEmp();
  const vis = eDraft.map((e, j) => j).filter(j => !eDraft[j].del), p = vis.indexOf(i);
  if (act === 'e-up' && p > 0) { const j = vis[p - 1]; [eDraft[i], eDraft[j]] = [eDraft[j], eDraft[i]]; }
  if (act === 'e-down' && p < vis.length - 1) { const j = vis[p + 1]; [eDraft[i], eDraft[j]] = [eDraft[j], eDraft[i]]; }
  if (act === 'e-del') { if (eDraft[i].arm || !eDraft[i].id) eDraft[i].del = true; else eDraft[i].arm = true; }
  drawEmp();
}
function saveEmp() {
  syncEmp();
  const removed = new Set(eDraft.filter(e => e.del && e.id).map(e => e.id));
  plan.employees = eDraft.filter(e => !e.del && (e.id || e.name.trim())).map(e => ({ id: e.id || newId('e'), name: e.name.trim() }));
  if (removed.size) Object.keys(plan.entries).forEach(k => { if (removed.has(k.split('__')[0])) delete plan.entries[k]; });
  closeDlg(); commit(true);
}

/* ---------- Turlar ---------- */
let tDraft = [];
function newTour(n) { return { id: null, code: 'T' + n, name: '', start: '07:00', end: '15:00', color: TOUR_COLORS[(n - 1) % TOUR_COLORS.length], del: false, arm: false }; }
function openTours() {
  tDraft = plan.tours.map(x => ({ ...x, del: false, arm: false }));
  if (!tDraft.length) tDraft.push(newTour(1));
  openDlg(`<h3>${t('tours')}</h3><p class="sub">${t('toursSub')}</p><div class="rows" id="tRows"></div>
    <button class="btn sm" data-act="t-add">${t('addTour')}</button>
    <div class="acts" style="margin-top:14px"><button class="btn" data-act="dlg-close">${t('cancel')}</button><button class="btn pri" data-act="t-save">${t('save')}</button></div>`, true);
  drawTours();
}
function syncTours() {
  document.querySelectorAll('#tRows .trow').forEach(r => {
    const x = tDraft[+r.dataset.i];
    x.code = r.querySelector('[data-f=code]').value; x.name = r.querySelector('[data-f=name]').value;
    x.start = r.querySelector('[data-f=start]').value; x.end = r.querySelector('[data-f=end]').value;
  });
}
function drawTours() {
  const vis = tDraft.map((x, i) => ({ x, i })).filter(v => !v.x.del);
  $('#tRows').innerHTML = vis.map(({ x, i }) => `
    <div class="trow" data-i="${i}">
      <input type="text" id="tc-${i}" data-f="code" value="${esc(x.code)}" maxlength="6" class="mono" aria-label="Kod">
      <input type="text" id="tn-${i}" data-f="name" value="${esc(x.name)}" maxlength="50" placeholder="${esc(t('tourPh'))}" aria-label="${esc(t('tourPh'))}">
      <input type="time" id="ts-${i}" data-f="start" value="${esc(x.start)}" aria-label="${esc(t('start'))}">
      <input type="time" id="te-${i}" data-f="end" value="${esc(x.end)}" aria-label="${esc(t('end'))}">
      <button class="btn sm warn" data-act="t-del">${x.arm ? t('sure') : t('del')}</button>
      <div class="c"><span class="colhead">${t('color')}</span>${TOUR_COLORS.map(c => `<button class="cpick" data-act="t-color" data-c="${c}" style="background:${c}" aria-label="${c}" aria-pressed="${x.color === c}"></button>`).join('')}</div>
    </div>`).join('') || `<div class="empty">—</div>`;
}
function tourAction(act, i, el) {
  syncTours();
  const x = tDraft[i];
  if (act === 't-color') x.color = el.dataset.c;
  if (act === 't-del') { if (x.arm || !x.id) x.del = true; else x.arm = true; }
  drawTours();
}
function saveTours() {
  syncTours();
  plan.tours = tDraft.filter(x => !x.del && (x.code.trim() || x.name.trim())).map(x => ({
    id: x.id || newId('t'), code: (x.code.trim() || x.name.trim().slice(0, 4)).toUpperCase(), name: x.name.trim() || x.code.trim(),
    start: x.start || '', end: x.end || '', color: x.color || TOUR_COLORS[0]
  }));
  closeDlg(); commit(true);
}

/* ---------- Paylaş (WhatsApp) ---------- */
const waLink = text => 'https://wa.me/?text=' + encodeURIComponent(text);
function openShare() {
  const url = plan.shareUrl;
  const rows = plan.employees.map(e => {
    const link = url ? url + '#' + e.id : '';
    return `<div class="prow"><span>${esc(empName(e))}</span>
      <a class="btn sm wa" href="${esc(waLink(t('msgOne', { name: empName(e), url: link })))}" target="_blank" rel="noopener">WhatsApp</a>
      <button class="btn sm" data-act="copy" data-text="${esc(link)}">${t('copy')}</button></div>`;
  }).join('');
  openDlg(`<h3>${t('shareT')}</h3><p class="sub">${t('shareSub')}</p>
    <ol class="steps"><li>${t('step1')}</li><li>${t('step2')}</li></ol>
    <div class="f"><label for="shareUrl">${t('link')}</label>
      <div class="copyrow"><input type="url" id="shareUrl" value="${esc(url)}" placeholder="https://claude.ai/artifact/…"><button class="btn" data-act="copy" data-from="#shareUrl">${t('copy')}</button></div>
    </div>
    <a class="btn wa wa-all" href="${esc(waLink(t('msgAll', { url })))}" target="_blank" rel="noopener">${t('waAll')}</a>
    <div class="f" style="margin-top:16px"><span class="l">${t('perPerson')}</span><div class="plist">${rows}</div></div>
    <div class="acts"><button class="btn" data-act="dlg-close">${t('close')}</button></div>`, true);
}
async function copyText(text, input) {
  try { await navigator.clipboard.writeText(text); toast(t('copied')); }
  catch (e) { if (input) { input.focus(); input.select(); } else toast(text); }
}

/* =========================================================
   OLAYLAR (tek yerden)
   ========================================================= */
function go(delta) { const d = new Date(view.y, view.m + delta, 1); view = { y: d.getFullYear(), m: d.getMonth() }; render(); const w = $('#gridWrap'); if (w) w.scrollLeft = 0; }
function scrollToday() {
  const w = $('#gridWrap'); if (!w) return;
  const th = w.querySelector('th.is-today'), s = w.querySelector('thead .sticky');
  w.scrollLeft = th ? Math.max(0, th.offsetLeft - (s ? s.offsetWidth : 0) - 8) : 0;
}

document.addEventListener('click', ev => {
  if (ev.target.id === 'ov') return closeDlg();
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'lang': lang = el.dataset.l; sSet('l', 'ea.lang', lang); renderShell(); render(); break;
    case 'prev': go(-1); break;
    case 'next': go(1); break;
    case 'today': { const d = new Date(); view = { y: d.getFullYear(), m: d.getMonth() }; render(); scrollToday(); break; }
    case 'brush': setBrush(!brushOn); break;
    case 'brush-done': setBrush(false); if (pending) publishNow(); break;
    case 'bstatus': brushStatus = el.dataset.s; renderBrush(); break;
    case 'undo': undo(); break;
    case 'save-now': publishNow(); break;
    case 'cell': if (!canEdit) break; if (brushOn) applyBrush([{ empId: el.dataset.emp, dk: el.dataset.date }]); else openCell(el.dataset.emp, el.dataset.date); break;
    case 'dayhead': if (canEdit && brushOn) applyBrush(plan.employees.map(e => ({ empId: e.id, dk: el.dataset.date }))); break;
    case 'rename': if (!brushOn) openEmp(false, el.dataset.emp); break;
    case 'emp-new': openEmp(true); break;
    case 'emp-open': openEmp(false); break;
    case 'tour-open': openTours(); break;
    case 'share-open': openShare(); break;
    case 'dlg-close': closeDlg(); break;
    case 'cell-save': saveCell(false); break;
    case 'cell-clear': saveCell(true); break;
    case 'e-up': case 'e-down': case 'e-del': empAction(a, +el.closest('.row').dataset.i); break;
    case 'e-add': syncEmp(); eDraft.push({ id: null, name: '', del: false, arm: false }); drawEmp(); document.getElementById('emp-' + (eDraft.length - 1))?.focus(); break;
    case 'e-save': saveEmp(); break;
    case 't-color': case 't-del': tourAction(a, +el.closest('.trow').dataset.i, el); break;
    case 't-add': syncTours(); tDraft.push(newTour(tDraft.filter(x => !x.del).length + 1)); drawTours(); break;
    case 't-save': saveTours(); break;
    case 'copy': { const inp = el.dataset.from ? $(el.dataset.from) : null; copyText(inp ? inp.value : el.dataset.text, inp); break; }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeDlg();
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.day[data-act]')) ev.target.click();
});
document.addEventListener('change', ev => {
  const id = ev.target.id;
  if (id === 'who') { who = ev.target.value; sSet('l', 'ea.who', who); render(); }
  else if (id === 'bTour') { brush.tour = ev.target.value; const x = tourById(brush.tour); if (x && x.start && x.end) { brush.start = x.start; brush.end = x.end; $('#bStart').value = x.start; $('#bEnd').value = x.end; } renderBrush(); }
  else if (id === 'cTour') { const x = tourById(ev.target.value); if (x && x.start && x.end) { $('#cStart').value = x.start; $('#cEnd').value = x.end; } refreshCellForm(); }
  else if (ev.target.name === 'st') refreshCellForm();
  else if (id === 'shareUrl') { plan.shareUrl = ev.target.value.trim().replace(/#.*$/, ''); openShare(); commit(true); }
});
document.addEventListener('input', ev => {
  const id = ev.target.id;
  if (id === 'bStart' || id === 'bEnd') { brush[id === 'bStart' ? 'start' : 'end'] = ev.target.value; renderBrush(); }
  else if (id === 'cStart' || id === 'cEnd') refreshCellForm();
});

/* =========================================================
   BAŞLAT
   ========================================================= */
renderShell();
render();
setTimeout(() => { const w = $('#gridWrap'); if (restoredScroll != null && w) w.scrollLeft = restoredScroll; else scrollToday(); }, 60);

(async () => {
  const cl = window.claude;
  if (!cl || !cl.use) return;                       // bağımsız dosya olarak açıldıysa: salt okunur
  const [art, user] = await Promise.all([cl.use('artifact'), cl.use('user')]);
  artifactNs = art;
  canEdit = !!(art && user && await user.canEdit());
  if (!canEdit) brushOn = false;
  render();
})();
</script>
